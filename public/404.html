<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Rantly</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- The last resort (task rantly-adopts-not-found-page; studio-engine
       docs/NOT_FOUND_PAGE.md). The friendly not-found page is the engine's
       Studio::ExceptionsApp, inside Rantly's layout. This file answers when that
       page cannot render, and the static build (lib/static_site.rb) ships it as
       is, so it stands alone: no script, no stylesheet, no font to fetch, only
       files already in public/. Same words and the same data-test hooks as the
       engine page. Rantly's colours (app/assets/stylesheets/application.css):
       warm paper, warm ink, one loud accent. Plain colour values, no custom
       properties, so an old browser reads it. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-color: #f5f1ea;
      color: #57504a;
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 30rem;
      padding: 40px 24px;
      text-align: center;
      background: #fffdf9;
      border: 1px solid #e3dccf;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(40, 30, 20, 0.06), 0 4px 16px rgba(40, 30, 20, 0.05);
    }
    img { display: block; width: 64px; height: 64px; margin: 0 auto 24px; }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d63c1f;
    }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: -0.03em; color: #1d1a16; }
    p.message { margin: 0 0 28px; }
    a.home {
      display: inline-block;
      width: 100%;
      padding: 12px 22px;
      border-radius: 999px;
      background: #d63c1f;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      text-decoration: none;
    }
    a.home:hover { background: #c2351a; }
    a.home:focus-visible { outline: 3px solid #d63c1f; outline-offset: 2px; }
    @media (min-width: 640px) { a.home { width: auto; } }
    @media (prefers-color-scheme: dark) {
      body { background-color: #16130f; color: #c4bab0; }
      main { background: #1f1b16; border-color: #372f27; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
      .eyebrow { color: #ff6a4d; }
      h1 { color: #f3ede4; }
      a.home { background: #ff6a4d; color: #1a0d08; }
      a.home:hover { background: #ff8066; }
      a.home:focus-visible { outline-color: #ff6a4d; }
    }
  </style>
</head>
<body data-static-404>
  <main data-test="not-found" aria-labelledby="not-found-title">
    <img src="/icon.svg" alt="Rantly" width="64" height="64">
    <p class="eyebrow">404 &middot; Not found</p>
    <h1 id="not-found-title">This page isn’t here</h1>
    <p class="message">The address may be mistyped, or the page may have moved. Head back home and pick up from there.</p>
    <a class="home" href="/" data-test="not-found-home">Back to Rantly</a>
  </main>
</body>
</html>
