rants:
  - id: we-said-140-and-we-meant-it
    author: rantly
    title: We said 140 minimum, and we meant it
    posted_at: 2026-09-26T09:00:00-06:00
    body: |-
      In 2014 we looked at Twitter, with its tidy little 140-character ceiling, and we thought: that is not nearly enough room to be properly annoyed about something. So we built the opposite. On Rantly, 140 characters is the floor. You cannot post until you have at least that much to say.

      Twelve years later the other place raised its ceiling, then raised it again, then started charging for the privilege. We did not move the floor an inch. A rant needs space to breathe, to build, to double back on itself and find a second, angrier wind.

      So welcome back. Pull up a chair. Let it all out.

  - id: reply-all-is-not-a-personality
    author: deb_from_accounts
    title: Reply-all is not a personality
    posted_at: 2026-09-25T16:42:00-06:00
    body: |-
      At 9:14 this morning somebody in Facilities sent a note to the entire company about the second-floor microwave. That is fine. The microwave is a shared concern. What followed was not fine.

      By 9:20 we had "Please remove me from this list" from four people, each of whom hit reply-all to ask to be removed from the list. By 9:31 we had a man in Legal replying all to tell everyone to stop replying all, which, and I cannot stress this enough, is replying all.

      By lunch there were 212 messages. Two of them were about the microwave. I have worked in accounts payable for nineteen years and I have never once seen an invoice cause this much damage.

      The button is not a megaphone. It is a loaded weapon. Treat it that way.

  - id: boarding-group-nine
    author: gatelice
    title: There is no such thing as boarding group nine
    posted_at: 2026-09-25T06:05:00-06:00
    body: |-
      I am standing at gate B14 and the agent has just called boarding group nine. Nine. When I started flying for work there were two groups: people who needed extra time, and everybody else. Then there were four. Then there were zones, then there were groups and zones, and now there is a group for people who own the credit card and a separate group for people who own the more expensive credit card.

      Meanwhile forty adults are standing in a semicircle around the podium, blocking the lane, because every single one of them believes that being physically near the door will make group seven arrive sooner. It will not. The plane leaves at the same time for all of us. I know this because I have done it three hundred times.

      Stand back. Sit down. Your group will be called. Probably. Eventually. After group eight.

  - id: the-recipe-is-at-the-bottom
    author: soup_season
    title: I just want the recipe
    posted_at: 2026-09-24T18:30:00-06:00
    body: |-
      I clicked on a link that promised the best weeknight lentil soup. Before I reached a single ingredient I learned about the author's grandmother, a trip to Tuscany in 2011, the particular way the light falls in her kitchen in October, and her feelings about her kids going back to school.

      Then a video started playing. It was not about soup. Then a banner asked me to subscribe. Then another banner asked me to accept cookies, which is a cruel joke on a food blog.

      I scrolled for so long that the soup would have been done by the time I found the list. It called for one onion. I could have guessed the onion.

      Put the recipe first. Tell me about Tuscany afterward. I will read it, I promise, once I have eaten.

  - id: sixty-eight-is-a-sweater-temperature
    author: thermostat_war
    title: Sixty-eight is a sweater temperature
    posted_at: 2026-09-24T07:10:00-06:00
    body: |-
      Every October the same thing happens in this house. The first cool morning arrives, and somebody, I will not say who but she has been my wife for forty-one years, walks past the thermostat and nudges it to seventy-two.

      Seventy-two degrees is not a temperature. It is a greenhouse. It is a place where tomatoes grow. Human beings in the upper Midwest have survived for centuries on wool, flannel, and a firm refusal to pay the gas company one more cent than necessary.

      I have put a sweater on the arm of every chair. I have labeled the thermostat. I have explained the physics of heat loss through single-pane windows at the dinner table, twice. It is currently seventy-one. I am not winning, but I am not surrendering either.

  - id: this-is-the-quiet-car
    author: quietcarriage
    title: This is the quiet car
    posted_at: 2026-09-23T17:20:00-06:00
    body: |-
      There is a sign. It is on the door, it is on the ceiling, and it is on the back of every seat at eye level. It says QUIET CAR in letters two inches tall. The conductor announces it at every stop, in a voice that grows a little more tired each time.

      And yet tonight, in the quiet car, a man took a speakerphone call about a kitchen renovation. For eleven minutes I learned about grout. His contractor thinks the backsplash will be done by Thursday. It will not be done by Thursday. Nobody's backsplash is ever done by Thursday.

      I did not choose the quiet car for the scenery. I chose it because it was the one place in my day where nobody needed anything from me. Please. Headphones exist. Hallways exist. The other nine cars exist.

  - id: the-printer-knows
    author: nullpointer
    title: The printer knows when you are in a hurry
    posted_at: 2026-09-23T10:02:00-06:00
    body: |-
      I build distributed systems for a living. I can make a thousand servers agree on the order of events across three continents. I cannot make the office printer print one page.

      Today it wanted a driver update. Then it wanted me to install a companion app, sign in to the companion app, and agree to share usage data with the companion app. Then it said it was out of cyan, which, fine, except I was printing a black-and-white boarding pass.

      I am convinced the thing can sense urgency. On a slow Tuesday afternoon it prints perfectly. Ten minutes before a flight, it enters a spiritual crisis. Somewhere there is a firmware engineer who knows exactly why, and I would like to have a very long conversation with them.

  - id: the-soccer-group-chat
    author: tomas_parents
    title: The under-eights group chat has 214 messages
    posted_at: 2026-09-22T13:45:00-06:00
    body: |-
      My daughter plays soccer. She is seven. The games are forty minutes long and nobody keeps score, officially, although every single child knows the score.

      The parents' group chat for this team currently holds 214 unread messages. I opened it hoping to learn what time Saturday's game starts. Instead I learned that one family is gluten-free, one family is sorry about last week, and one father has strong feelings about orange slices versus clementines.

      The start time was mentioned once, in message 38, and then corrected in message 102, and then someone reacted to the correction with a thumbs up, which could mean agreement or could mean the old time. I will be at the field at 8:30 and at 9:30. I am bringing orange slices. I have chosen a side.

  - id: cancel-means-cancel
    author: deb_from_accounts
    title: Cancel means cancel
    posted_at: 2026-09-21T20:15:00-06:00
    body: |-
      Signing up for the streaming service took one tap. One. My thumb barely touched the glass and I was paying monthly for a documentary about competitive cheese rolling.

      Cancelling took nine screens. Are you sure. Here is a discount. Would you like to pause instead. Tell us why you are leaving. Here is a bigger discount. Did you know about our new shows. Please call this number between nine and five on a weekday.

      I process cancellations for a living. A cancellation is a single line on a form. If I made a vendor walk through nine screens to stop paying us, I would be escorted out of the building, and rightly so.

  - id: self-checkout-is-a-job
    author: gatelice
    title: Self-checkout is an unpaid internship
    posted_at: 2026-09-20T11:00:00-06:00
    body: |-
      Somewhere along the way I became a cashier. Nobody interviewed me. Nobody trained me. I just walked into the grocery store and the grocery store handed me a scanner and a small screen that yells at me.

      Unexpected item in the bagging area. There is no unexpected item. The only item in the bagging area is the bag, which the machine has seen ten thousand times and still regards with suspicion. Then a light starts flashing and I stand there like a man who has robbed a bank with a bunch of bananas, waiting for the one employee supervising eight machines to come and forgive me.

      If I am going to do the job, I would like the discount. Or at least a name tag.

  - id: autocorrect-knows-best
    author: nullpointer
    title: Autocorrect has never met me
    posted_at: 2026-09-19T08:40:00-06:00
    body: |-
      I have typed the word "kubectl" roughly four times a day for six years. My phone has seen it at least eight thousand times. This morning it changed it to "cubical" and sent it to my entire team.

      Meanwhile it has learned, permanently and with total confidence, a typo I made once in 2021 while trying to text my brother from a moving bus. It suggests that typo daily. It is the first word it offers when I type the letter k.

      Machine learning is extraordinary. It can write a sonnet and describe a photograph. It cannot learn my job title, and it will not forget my worst moment. That is not intelligence. That is my aunt at Thanksgiving.

  - id: check-in-is-at-four
    author: gatelice
    title: Why is hotel check-in at four o'clock
    posted_at: 2026-09-18T12:05:00-06:00
    body: |-
      My flight landed at eight in the morning. I have been awake for twenty-two hours. I am standing in a hotel lobby holding a coffee I do not want, and the gentleman at the desk is explaining, with real sympathy, that check-in is at four.

      Checkout is at eleven. That leaves five hours in which, I am told, the room is cleaned. I have seen these rooms cleaned. It takes forty minutes and a cart. I understand that the hotel has a schedule, but I also understand that there are three hundred rooms and that surely one of them is ready.

      I will be in the lobby. I will be in the lobby for a long time. I have taken the good chair by the window and I will not be giving it back.

  - id: soup-is-a-meal
    author: soup_season
    title: Soup is a meal and I will not debate this
    posted_at: 2026-09-16T19:00:00-06:00
    body: |-
      Every autumn someone at a dinner party tells me, with a small knowing smile, that soup is not a meal. That it is a starter. That it is what you have before the real food arrives.

      I have made a white bean and kale soup with sausage that has kept a family of five full through a Minnesota blizzard. I have made a chicken and rice soup that has cured, anecdotally, four colds and one heartbreak. I have made ramen broth that took fourteen hours and a very patient neighbor.

      Soup is a meal. Soup has been a meal for thousands of years across every culture that has ever owned a pot. Bring bread if you must. But do not tell me it is a starter while you are on your third bowl.

  - id: the-meeting-could-have-been-an-email
    author: tomas_parents
    title: This call could have been one sentence
    posted_at: 2026-09-14T15:30:00-06:00
    body: |-
      I blocked out nap time, the one sacred hour in my week, to join a call titled "Quick sync." It was not quick. We did not sync.

      For the first eight minutes we waited for people to join. For the next six minutes someone shared the wrong screen. For the remaining thirty-one minutes we discussed a decision that, it emerged near the end, had already been made by someone who was not on the call.

      The action item was "Follow up by email." We could have started there. We could have ended there. My children, meanwhile, woke up early and painted the dog, and honestly, the dog looks great, but that is a different rant.

