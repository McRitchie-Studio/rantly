# comment the app shows lives in this file, and SampleData loads it once at
# boot. Everyone here is fictional.
#
# The house rules, which SampleDataTest enforces:
#   - a rant's body is at least 140 characters (Rantly's founding promise:
#     the opposite of Twitter) and its title at most 50
#   - every handle a rant, comment or follow names is a user below
#   - nobody follows themselves, and nobody follows the same person twice
#   - a comment is posted after the rant it answers

